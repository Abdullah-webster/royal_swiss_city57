<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#FAF5EF"/>

  <g stroke="#C28D4B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Horizontal Divider Line -->
    <line x1="30" y1="95" x2="105" y2="95"/>

    <!-- Right Horizontal Divider Line -->
    <line x1="195" y1="95" x2="270" y2="95"/>

    <!-- Base / Rim Bands -->
    <path d="M 115 110 L 185 110"/>
    <path d="M 113 103 L 187 103"/>

    <!-- Crown Body Outlines & Inner Ribs -->
    <!-- Base outer corners to lower tips -->
    <path d="M 113 103 C 110 90, 105 78, 102 68"/>
    <path d="M 187 103 C 190 90, 195 78, 198 68"/>

    <!-- Outer Peaks to Inward Valleys -->
    <path d="M 102 68 Q 112 78, 122 80"/>
    <path d="M 198 68 Q 188 78, 178 80"/>

    <!-- Valleys to Secondary Mid Peaks -->
    <path d="M 122 80 L 132 68"/>
    <path d="M 178 80 L 168 68"/>

    <!-- Inner Valleys to Center Peak -->
    <path d="M 132 68 L 140 75 L 150 50 L 160 75 L 168 68"/>

    <!-- Vertical Inner Structural Arches -->
    <path d="M 125 103 Q 120 85, 122 80"/>
    <path d="M 175 103 Q 180 85, 178 80"/>
    <path d="M 137 103 Q 135 80, 132 68"/>
    <path d="M 163 103 Q 165 80, 168 68"/>

    <!-- Central Flame / Flame-shaped Opening -->
    <path d="M 150 62 C 145 75, 146 88, 150 98 C 154 88, 155 75, 150 62 Z"/>

    <!-- Jewels / Circles on Peaks -->
    <circle cx="102" cy="68" r="3.5" fill="#FAF5EF"/>
    <circle cx="132" cy="68" r="3.5" fill="#FAF5EF"/>
    <circle cx="150" cy="48" r="4" fill="#FAF5EF"/>
    <circle cx="168" cy="68" r="3.5" fill="#FAF5EF"/>
    <circle cx="198" cy="68" r="3.5" fill="#FAF5EF"/>
  </g>
</svg>
